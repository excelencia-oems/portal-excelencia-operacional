<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestionar mi Agenda · Modelo de Excelencia Operacional</title>
<style>
  :root{
    --oems-teal:#009899; --oems-teal-dark:#046566;
    --oems-beige:#D1BF99; --oems-beige-dark:#8C7A4E;
    --oems-terra:#C04F15; --oems-terra-dark:#7A310D;
    --oems-graphite:#2C2C2A; --oems-graphite-dark:#141412;
    --gray-900:#2C2C2A; --gray-700:#444441; --warm-gray-500:#5F5E5A;
    --warm-gray-300:#B4B2A9; --warm-gray-100:#D3D1C7; --warm-gray-50:#F1EFE8;
    --green-500:#0F6E56; --green-50:#E1F5EE;
    --amber-500:#BA7517; --amber-50:#FAEEDA;
    --red-600:#993C1D; --red-50:#FAECE7;
    --white:#FFFFFF;
    --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --font-body:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); background:linear-gradient(180deg, #FFFFFF 0%, #E1F5EE 100%); color:var(--gray-900); line-height:1.5;}

  header{background:var(--white); border-bottom:1px solid var(--warm-gray-100);}
  .topbanner{background:#fff; border-bottom:1px solid var(--warm-gray-100); padding:12px clamp(16px,3vw,32px);}
  .topbanner-inner{max-width:min(1100px,92vw); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .topbanner-inner img{height:36px; width:auto; max-width:130px; object-fit:contain; display:block; flex-shrink:0;}
  .banner-center{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; flex:1;}
  .banner-crumbs{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .crumb-chip{font-size:11.5px; font-weight:600; color:var(--gray-700); background:var(--warm-gray-50); padding:5px 12px; border-radius:100px; text-decoration:none;}
  .crumb-chip:hover{background:var(--warm-gray-100);}
  .crumb-chip.current{background:#EDEAE1; color:var(--gray-900); font-weight:700;}
  .crumb-arrow{color:var(--warm-gray-300); font-size:11px;}

  .fab-home{
    position:fixed; bottom:22px; right:22px; width:52px; height:52px; border-radius:100px;
    background:var(--oems-graphite); display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 6px 16px rgba(20,20,18,0.28); z-index:80; text-decoration:none;
  }
  .fab-home svg{width:22px; height:22px;}

  main{max-width:min(1100px, 92vw); margin:0 auto; padding:clamp(20px,4vw,34px) clamp(16px,3vw,32px) 90px;}
  .panel-full{max-width:none; width:96vw; margin-left:calc(50% - 48vw); margin-right:calc(50% - 48vw);}

  .practice-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .pilar-tag{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    display:inline-flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .dot{width:8px; height:8px; border-radius:100px; background:var(--oems-graphite);}
  .practice-head h1{font-family:var(--font-display); font-size:clamp(19px,2.6vw,26px); font-weight:700; max-width:640px;}
  .practice-head .subt{font-size:13px; color:var(--warm-gray-500); margin-top:4px;}

  .btn-primary{
    background:var(--oems-teal); color:#fff; border:none; padding:11px 18px; border-radius:10px;
    font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(0.9);}
  .btn-secondary{
    background:#fff; color:var(--gray-900); border:1.5px solid var(--warm-gray-100); padding:10px 16px; border-radius:10px;
    font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-secondary:hover{border-color:var(--oems-teal); color:var(--oems-teal);}
  .btn-danger{background:#fff; color:var(--red-600); border:1.5px solid var(--red-50); padding:7px 12px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer;}
  .btn-danger:hover{background:var(--red-50);}
  .btn-sm{padding:6px 12px; font-size:12px; border-radius:8px;}

  .edicion-bar{display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .edicion-badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--oems-teal); background:var(--green-50); padding:6px 12px; border-radius:100px;}

  .panel{background:#fff; border:1px solid var(--warm-gray-100); border-radius:14px; padding:24px; margin-bottom:22px;}
  .panel h2{font-family:var(--font-display); font-size:14.5px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .panel h2 svg{width:17px; height:17px; color:var(--oems-teal);}
  .panel-head-row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .panel-head-row h2{margin-bottom:0;}

  /* ---- Nivel selector ---- */
  .nivel-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:24px;}
  .nivel-card{
    background:#fff; border:1.5px solid var(--warm-gray-100); border-radius:14px; padding:22px 18px; text-align:left;
    cursor:pointer; transition:.15s; font-family:inherit;
  }
  .nivel-card:hover{border-color:var(--oems-teal); box-shadow:0 6px 18px rgba(0,152,153,.12); transform:translateY(-1px);}
  .nivel-card.active{border-color:var(--oems-teal); background:var(--green-50);}
  .nivel-card .nc-icon{width:36px; height:36px; border-radius:10px; background:var(--warm-gray-50); display:flex; align-items:center; justify-content:center; margin-bottom:12px; color:var(--oems-teal);}
  .nivel-card .nc-icon svg{width:19px; height:19px;}
  .nivel-card .nc-title{font-family:var(--font-display); font-weight:700; font-size:14.5px; margin-bottom:3px;}
  .nivel-card .nc-sub{font-size:11.5px; color:var(--warm-gray-500);}

  /* ---- Buscador ---- */
  .search-box{position:relative; max-width:340px; margin-bottom:16px;}
  .search-box input{width:100%; padding:10px 14px 10px 36px; border:1.5px solid var(--warm-gray-100); border-radius:10px; font-size:13px; font-family:inherit;}
  .search-box input:focus{outline:none; border-color:var(--oems-teal);}
  .search-box svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:15px; height:15px; color:var(--warm-gray-500);}

  /* ---- Lista de personas ---- */
  .persona-list{display:flex; flex-direction:column; gap:2px;}
  .persona-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 10px; border-radius:10px; cursor:pointer; transition:.1s;}
  .persona-row:hover{background:var(--warm-gray-50);}
  .persona-row .pr-nombre{font-weight:700; font-size:13.5px;}
  .persona-row .pr-cargo{font-size:12px; color:var(--warm-gray-500);}
  .persona-row .pr-arrow{color:var(--warm-gray-300); flex-shrink:0;}
  .empty-note{font-size:13px; color:var(--warm-gray-500); padding:20px 10px; text-align:center;}

  /* ---- Organigrama (CSS puro, líneas de jerarquía) ---- */
  .orgchart-wrap{overflow-x:auto; padding:10px 0 6px;}
  .orgchart{display:flex; justify-content:center; min-width:min-content;}
  .orgchart ul{display:flex; padding-top:26px; position:relative;}
  .orgchart > ul{padding-top:0;}
  .orgchart li{list-style:none; text-align:center; position:relative; padding:20px 5px 0 5px;}
  .orgchart li::before, .orgchart li::after{content:''; position:absolute; top:0; right:50%; border-top:2px solid var(--warm-gray-300); width:50%; height:20px;}
  .orgchart li::after{right:auto; left:50%; border-left:2px solid var(--warm-gray-300);}
  .orgchart li:only-child::after, .orgchart li:only-child::before{display:none;}
  .orgchart li:only-child{padding-top:0;}
  .orgchart li:first-child::before, .orgchart li:last-child::after{border:0 none;}
  .orgchart li:last-child::before{border-right:2px solid var(--warm-gray-300); border-radius:0 6px 0 0;}
  .orgchart li:first-child::after{border-radius:6px 0 0 0;}
  .orgchart ul ul::before{content:''; position:absolute; top:0; left:50%; border-left:2px solid var(--warm-gray-300); width:0; height:20px;}

  .org-node{display:inline-block; border-radius:9px; padding:7px 9px; background:#fff; border:1.5px solid var(--warm-gray-100); cursor:pointer; min-width:82px; max-width:120px; box-shadow:0 2px 6px rgba(4,52,44,.06); transition:.15s; font-family:inherit;}
  .org-node:hover{box-shadow:0 5px 14px rgba(0,152,153,.2); transform:translateY(-1px); filter:brightness(0.97);}
  .org-node .on-nombre{font-weight:700; font-size:10.5px; line-height:1.2;}
  .org-node .on-cargo{font-size:9px; margin-top:1px; line-height:1.2; opacity:0.85;}
  .org-node.nivel-0{background:var(--oems-graphite); border-color:var(--oems-graphite-dark);}
  .org-node.nivel-0 .on-nombre, .org-node.nivel-0 .on-cargo{color:#fff;}
  .org-node.nivel-1{background:var(--green-50); border-color:var(--oems-teal);}
  .org-node.nivel-1 .on-nombre{color:var(--oems-teal-dark);}
  .org-node.nivel-1 .on-cargo{color:var(--oems-teal-dark);}
  .org-node.nivel-2{background:var(--oems-beige); border-color:var(--oems-beige-dark);}
  .org-node.nivel-2 .on-nombre, .org-node.nivel-2 .on-cargo{color:var(--oems-beige-dark);}
  .org-node.nivel-3{background:var(--amber-50); border-color:var(--amber-500);}
  .org-node.nivel-3 .on-nombre, .org-node.nivel-3 .on-cargo{color:var(--amber-500);}

  /* ---- Modales genéricos ---- */
  .modal-overlay{position:fixed; inset:0; background:rgba(20,20,18,0.5); z-index:200; display:flex; align-items:flex-start; justify-content:center; padding:30px 20px; overflow-y:auto;}
  .modal{background:#fff; border-radius:16px; max-width:720px; width:100%; box-shadow:0 20px 50px rgba(0,0,0,0.3); margin:auto;}
  .modal.wide{max-width:920px;}
  .modal-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:20px 22px; border-bottom:1px solid var(--warm-gray-100);}
  .modal-head h3{font-family:var(--font-display); font-size:16px; font-weight:700;}
  .modal-head .mh-sub{font-size:12px; color:var(--warm-gray-500); margin-top:2px;}
  .modal-close{background:var(--warm-gray-50); border:none; width:30px; height:30px; border-radius:100px; font-size:15px; cursor:pointer; flex-shrink:0;}
  .modal-body{padding:20px 22px; max-height:70vh; overflow-y:auto;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--warm-gray-100);}

  /* ---- Tabla editable (organigrama / listas) ---- */
  .edit-table{width:100%; border-collapse:collapse;}
  .edit-table th{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--warm-gray-500); text-align:left; padding:6px 8px; border-bottom:1px solid var(--warm-gray-100);}
  .edit-table td{padding:6px 8px; border-bottom:1px solid var(--warm-gray-100); vertical-align:middle;}
  .edit-table input, .edit-table select{width:100%; padding:7px 9px; border:1.5px solid var(--warm-gray-100); border-radius:7px; font-size:12.5px; font-family:inherit;}
  .edit-table input:focus, .edit-table select:focus{outline:none; border-color:var(--oems-teal);}
  .field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
  .field label{font-size:12px; font-weight:700; color:var(--gray-700);}
  .field input{padding:9px 11px; border:1.5px solid var(--warm-gray-100); border-radius:9px; font-size:13px; font-family:inherit; width:100%;}
  .field input:focus{outline:none; border-color:var(--oems-teal);}

  /* ---- Agenda semanal ---- */
  .agenda-toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .agenda-grid{--rowh:38px; display:grid; grid-template-columns:52px repeat(7,minmax(90px,1fr)); border:1px solid var(--warm-gray-100); border-radius:10px; overflow:hidden;}
  .ag-corner{background:var(--warm-gray-50); border-bottom:1px solid var(--warm-gray-100);}
  .ag-head{background:var(--warm-gray-50); padding:6px 3px; text-align:center; font-size:9.5px; font-weight:700; border-bottom:1px solid var(--warm-gray-100); border-left:1px solid var(--warm-gray-100);}
  .ag-hours{display:flex; flex-direction:column;}
  .ag-hourlabel{height:var(--rowh); font-size:9.5px; color:var(--warm-gray-500); text-align:right; padding-right:6px; box-sizing:border-box; border-top:1px solid var(--warm-gray-100); display:flex; align-items:flex-start; justify-content:flex-end;}
  .ag-hourlabel:first-child{border-top:none;}
  .agenda-daycol{position:relative; border-left:1px solid var(--warm-gray-100); background-image:repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--rowh) - 1px), var(--warm-gray-100) calc(var(--rowh) - 1px), var(--warm-gray-100) var(--rowh));}
  .agenda-block{position:absolute; left:2px; right:2px; border-radius:6px; background:var(--oems-teal); color:#fff; font-size:9.5px; font-weight:700; padding:3px 5px; overflow:hidden; line-height:1.25; box-shadow:0 2px 5px rgba(0,152,153,.25); cursor:default;}
  .agenda-block .ab-nombre{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .agenda-block.compacto{padding:1px 5px; font-size:8.5px; display:flex; align-items:center;}
  .ab-check{position:absolute; top:1px; right:1px; width:12px; height:12px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:900; box-shadow:0 1px 3px rgba(0,0,0,.3); line-height:1;}
  .ab-check.ok{color:#2F9E5B;}
  .ab-check.no{color:#B4423A;}
  .ab-check.pend{color:var(--warm-gray-500); cursor:pointer;}
  .ab-check.pend:hover{color:var(--oems-teal); transform:scale(1.15);}
  .agenda-block .ab-hora{font-weight:400; opacity:.85; font-size:9px;}
  .agenda-empty-msg{font-size:12.5px; color:var(--warm-gray-500); text-align:center; padding:16px;}
  .week-nav{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:10px;}
  .week-nav-label{font-size:12px; font-weight:700; color:var(--gray-700); min-width:200px; text-align:center;}
  .agenda-layout{display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap;}
  .agenda-main{flex:1; min-width:340px;}
  .agenda-side{width:280px; flex-shrink:0; display:flex; flex-direction:column; gap:14px;}
  .radar-box{background:var(--warm-gray-50); border-radius:12px; padding:12px; text-align:center;}
  .radar-title{font-size:11px; font-weight:700; color:var(--gray-700); margin-bottom:8px; text-align:left;}
  .target-box{background:var(--warm-gray-50); border-radius:12px; padding:14px;}
  .target-grid{display:flex; flex-direction:column; gap:8px;}
  .target-field{display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; font-weight:700;}
  .target-field input{width:56px; padding:5px 7px; border:1.5px solid var(--warm-gray-100); border-radius:7px; font-size:12px; font-family:inherit;}
  .cat-legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; padding-top:10px; border-top:1px solid var(--warm-gray-100);}
  .cl-item{display:flex; align-items:center; gap:5px; font-size:11px; color:var(--warm-gray-500);}
  .cl-dot{width:9px; height:9px; border-radius:100px; flex-shrink:0;}
  @media (max-width:720px){ .agenda-side{width:100%;} }

  .asignar-list{display:flex; flex-direction:column; gap:2px; max-height:340px; overflow-y:auto;}
  .asignar-row{display:flex; align-items:flex-start; gap:10px; padding:9px 8px; border-radius:8px;}
  .asignar-row:hover{background:var(--warm-gray-50);}
  .asignar-row input[type=checkbox]{margin-top:3px; width:16px; height:16px; flex-shrink:0; accent-color:var(--oems-teal);}
  .asignar-row .ar-nombre{font-weight:700; font-size:12.5px;}
  .asignar-row .ar-detalle{font-size:11px; color:var(--warm-gray-500);}
  .puntual-list{margin-top:14px; font-size:12px; color:var(--warm-gray-500);}
  .puntual-item{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--warm-gray-50);}

  .small-note{font-size:12px; color:var(--warm-gray-500); margin-top:4px;}
  .center-msg{text-align:center; padding:40px 20px; color:var(--warm-gray-500); font-size:13.5px;}

  @media (max-width:640px){
    .agenda-grid{grid-template-columns:40px repeat(7,minmax(70px,1fr)); overflow-x:auto;}
  }

  .digital-transition{
    position:fixed; inset:0; z-index:300; overflow:hidden;
    background:linear-gradient(135deg, var(--oems-graphite), var(--oems-graphite-dark));
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    opacity:1; transition:opacity .4s ease;
  }
  .digital-transition.fade-out{opacity:0; pointer-events:none;}
  .dt-scanlines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 4px);
    animation:dtScan 1.1s linear infinite;
  }
  @keyframes dtScan{ from{ background-position-y:0; } to{ background-position-y:40px; } }
  .dt-icon{
    width:74px; height:74px; border-radius:18px; background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; color:#fff;
    animation:dtPulse 1s ease-in-out infinite;
  }
  .dt-icon svg{width:34px; height:34px;}
  @keyframes dtPulse{ 0%,100%{ transform:scale(1); opacity:0.9; } 50%{ transform:scale(1.08); opacity:1; } }
  .dt-label{color:#fff; font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:0.02em; opacity:0.9;}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="digital-transition" id="arrivalOverlay">
  <div class="dt-scanlines"></div>
  <div class="dt-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V12M12 12H5v3M12 12h7v3"/></svg>
  </div>
  <div class="dt-label">Gestionar mi Agenda</div>
</div>

<script type="module">

}, 550);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, onSnapshot, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

// ---- Proyecto 1: Gestionar mi Agenda (lectura/escritura, clave EO) ----
const agendaConfig = {
  apiKey: "AIzaSyCI8oXECFRvZLev2__iMGggeAAs4VSjDms",
  authDomain: "gestionar-mi-agenda.firebaseapp.com",
  projectId: "gestionar-mi-agenda",
  storageBucket: "gestionar-mi-agenda.firebasestorage.app",
  messagingSenderId: "807535289431",
  appId: "1:807535289431:web:7befb05f1ddf0f95ab6f12"
};
const agendaApp = initializeApp(agendaConfig, "agenda");
const db = getFirestore(agendaApp);
const auth = getAuth(agendaApp);

// ---- Proyecto 2: Control de Asistencia a Reuniones (solo lectura) ----
// Reglas de ese proyecto: "allow read, write: if true;" en sesionesAsistencia,
// así que no necesita autenticarse para leer.
const asistenciaConfig = {
  apiKey: "AIzaSyA79jTAQnfEXEtbHMluv-srrbvOik57Cbo",
  authDomain: "asistenciatracker-714d5.firebaseapp.com",
  projectId: "asistenciatracker-714d5",
  storageBucket: "asistenciatracker-714d5.firebasestorage.app",
  messagingSenderId: "476087196575",
  appId: "1:476087196575:web:6c3eafb232df283504fbaa"
};
const asistenciaApp = initializeApp(asistenciaConfig, "asistencia");
const dbAsistencia = getFirestore(asistenciaApp);

let fbReady = new Promise((resolve, reject) => {
  onAuthStateChanged(auth, (user) => { if (user) resolve(user); });
  signInAnonymously(auth).catch(reject);
});

async function fbGetDoc(coleccion, id){
  await fbReady;
  const snap = await getDoc(doc(db, coleccion, id));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}
async function fbSetDoc(coleccion, id, data){
  await fbReady;
  await setDoc(doc(db, coleccion, id), data, { merge: true });
}
async function fbDeleteDoc(coleccion, id){
  await fbReady;
  await deleteDoc(doc(db, coleccion, id));
}
function fbListen(coleccion, cb){
  return onSnapshot(collection(db, coleccion), (snap) => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))));
}

function esc(s){ return (s == null ? "" : String(s)).replace(/[&<>"']/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[m])); }
function claveDe(nivel, id){ return `${nivel}_${id}`; }

// ---------- Fechas de la semana actual (para cruzar con asistencia real) ----------
function fechaISO(d){ return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function lunesDeSemana(offsetSemanas){
  offsetSemanas = offsetSemanas || 0;
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = (dia === 0 ? -6 : 1 - dia) + offsetSemanas * 7;
  return new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + diff);
}
function lunesDeEstaSemana(){ return lunesDeSemana(0); }
function fechaDeSemana(diaValor, offsetSemanas){
  const idx = DIAS.findIndex(d => d.v === diaValor);
  const lunes = lunesDeSemana(offsetSemanas);
  return fechaISO(new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + idx));
}
function fechaDeEstaSemana(diaValor){ return fechaDeSemana(diaValor, 0); }
function etiquetaSemana(offsetSemanas){
  const lunes = lunesDeSemana(offsetSemanas);
  const domingo = new Date(lunes.getFullYear(), lunes.getMonth(), lunes.getDate() + 6);
  const fmt = (d) => `${String(d.getDate()).padStart(2, "0")} ${MESES_CORTOS_ES[d.getMonth()]}`;
  const etiqueta = offsetSemanas === 0 ? "Semana actual" : "Semana anterior";
  return `${etiqueta} (${fmt(lunes)}–${fmt(domingo)})`;
}
// Misma normalización que usa Control de Asistencia (auth.js/asistencia.js) para comparar nombres.
function claveNombreCompat(nombre){ return (nombre || "").trim().replace(/\s+/g, " ").toLowerCase().replace(/\s+/g, ""); }
function buscarAsistencia(nombrePersona, sesionId, fecha){
  const clave = claveNombreCompat(nombrePersona);
  return STATE.registros.find(r => r.sesionId === sesionId && r.fecha === fecha && claveNombreCompat(r.nombre) === clave);
}
function buscarCompletadoActividad(clave, actividadId, fecha){
  return STATE.completados.find(c => c.clave === clave && c.actividadId === actividadId && c.fecha === fecha);
}

const MESES_CORTOS_ES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const DIAS = [
  { v:"lunes", c:"Lun" }, { v:"martes", c:"Mar" }, { v:"miercoles", c:"Mié" }, { v:"jueves", c:"Jue" },
  { v:"viernes", c:"Vie" }, { v:"sabado", c:"Sáb" }, { v:"domingo", c:"Dom" },
];
const HORA_INICIO = 7, HORA_FIN = 20;
const CLAVE_DEFECTO = "Excelencia OEMS";

const CATEGORIAS = {
  objetivo: { nombre: "Objetivo Común", color: "#3B6FCB" },
  procesos: { nombre: "Procesos Eficientes", color: "#2F9E5B" },
  mejora:   { nombre: "Mejora Continua", color: "#D6553A" },
  personas: { nombre: "Desarrollo de Personas", color: "#D9A62E" },
};
const COLOR_LIBRE = "#B4B2A9";

// Ventana de contabilización de horas para el gráfico araña: Lun-Mié 07:30-19:30, Jue 07:30-15:00.
const VENTANA_CONTABLE = {
  lunes:     { inicio: "07:30", fin: "19:30" },
  martes:    { inicio: "07:30", fin: "19:30" },
  miercoles: { inicio: "07:30", fin: "19:30" },
  jueves:    { inicio: "07:30", fin: "15:00" },
};

let STATE = {
  cargando: true,
  modoEdicion: false,
  nivelActivo: null,
  organigrama: [],
  personas: [],
  asignaciones: {},
  sesiones: [],
  actividadesCatalogo: [],
  registros: [],
  completados: [],
  search: "",
  personaAbierta: null,
  modal: null,
  modalNivel: null,
  actividadEditando: null,
  semanaOffset: 0,
  tendenciaVista: "semanal",
  tendenciaDatos: null,
  tendenciaError: null,
};

// ---------- Carga inicial ----------
function init(){
  fbListen("organigrama", (list) => { STATE.organigrama = list; render(); });
  fbListen("personas", (list) => { STATE.personas = list; render(); });
  fbListen("asignaciones", (list) => {
    const map = {};
    list.forEach(a => { map[a.id] = { sesionIds: a.sesionIds || [], duraciones: a.duraciones || {}, categorias: a.categorias || {}, target: a.target || null, actividades: a.actividades || {} }; });
    STATE.asignaciones = map;
    render();
  });
  onSnapshot(collection(dbAsistencia, "sesionesAsistencia"), (snap) => {
    const todas = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => s.activa !== false);
    STATE.sesiones = todas.filter(s => s.tipo !== "actividad");
    STATE.actividadesCatalogo = todas.filter(s => s.tipo === "actividad");
    render();
  }, (err) => console.error("Error leyendo sesiones/actividades de Control de Asistencia:", err));

  const hoyDate = new Date();
  const inicioMes = new Date(hoyDate.getFullYear(), hoyDate.getMonth(), 1);
  const lunesAtrasDate = lunesDeSemana(-1);
  const inicioConsulta = fechaISO(lunesAtrasDate < inicioMes ? lunesAtrasDate : inicioMes);
  const l = lunesDeSemana(0);
  const domingo = fechaISO(new Date(l.getFullYear(), l.getMonth(), l.getDate() + 6));
  onSnapshot(
    query(collection(dbAsistencia, "registrosAsistencia"), where("fecha", ">=", inicioConsulta), where("fecha", "<=", domingo)),
    (snap) => { STATE.registros = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    (err) => console.error("Error leyendo registros de asistencia:", err)
  );
  onSnapshot(
    query(collection(db, "completadosActividad"), where("fecha", ">=", inicioConsulta), where("fecha", "<=", domingo)),
    (snap) => { STATE.completados = snap.docs.map(d => ({ id: d.id, ...d.data() })); render(); },
    (err) => console.error("Error leyendo completadosActividad:", err)
  );

  fbGetDoc("config", "eo").then(async (cfg) => {
    if (!cfg) await fbSetDoc("config", "eo", { clave: CLAVE_DEFECTO });
    STATE.cargando = false;
    render();
  });
}
init();

// ---------- Render ----------
function render(){
  const activo = document.activeElement;
  if (activo && activo.id && (activo.tagName === "INPUT" || activo.tagName === "TEXTAREA" || activo.tagName === "SELECT")) {
    window.__focoPendiente = { id: activo.id, valor: activo.value, pos: activo.selectionStart };
  }
  const mbPrevio = document.querySelector("#ovModal .modal-body");
  window.__scrollModalBody = mbPrevio ? mbPrevio.scrollTop : null;
  const alPrevio = document.querySelector("#ovModal .asignar-list");
  window.__scrollAsignarList = alPrevio ? alPrevio.scrollTop : null;

  document.getElementById("edicionBadge").innerHTML = STATE.modoEdicion
    ? `<span class="edicion-badge">✓ Modo edición activo</span> <button class="btn-secondary btn-sm" onclick="cambiarClave()" style="margin-left:8px;">Cambiar clave</button>` : "";
  document.getElementById("btnClave").textContent = STATE.modoEdicion
    ? "🔓 Salir de modo edición" : "🔒 Modo edición (Excelencia)";

  document.getElementById("nivelGrid").innerHTML = renderNivelGrid();

  const cont = document.getElementById("contenidoNivel");

// ---------- Comité Ejecutivo (organigrama) ----------
function construirArbol(lista){
  const porId = {};
  lista.forEach(n => { porId[n.id] = { ...n, hijos: [] }; });
  const raices = [];
  lista.forEach(n => {
    if (n.parentId && porId[n.parentId]) porId[n.parentId].hijos.push(porId[n.id]);
    else raices.push(porId[n.id]);
  });
  const porOrden = (a, b) => (a.orden || 0) - (b.orden || 0);
  raices.sort(porOrden);
  Object.values(porId).forEach(n => n.hijos.sort(porOrden));
  return raices;
}

// ---------- Agenda semanal de una persona ----------
function minutosDesde(horaTexto){
  const [h, m] = (horaTexto || "0:0").split(":").map(Number);
  return h * 60 + (m || 0);
}
function minutosAHora(totalMin){
  const h = Math.floor(totalMin / 60), m = totalMin % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
function sesionOcurrenciasEnDia(sesion, diaValor){
  if (sesion.frecuencia === "unica") return [];
  const aplica = sesion.frecuencia === "diaria" || (sesion.frecuencia === "dias" && (sesion.dias || []).includes(diaValor));
  if (!aplica) return [];
  if (sesion.modoTurno === "ambos") return [
    { horaInicio: sesion.horaInicio || "09:00", horaFin: sesion.horaFin || "" },
    { horaInicio: sesion.horaInicioB || "09:00", horaFin: sesion.horaFinB || "" },
  ];
  if (sesion.modoTurno === "B") return [{ horaInicio: sesion.horaInicioB || "09:00", horaFin: sesion.horaFinB || "" }];
  return [{ horaInicio: sesion.horaInicio || "09:00", horaFin: sesion.horaFin || "" }];
}
function descripcionFrecuencia(s){
  if (s.frecuencia === "unica") return `Puntual · ${s.fechaUnica || "—"} · ${s.horaInicio || ""}`;
  if (s.frecuencia === "dias") return `${(s.dias || []).map(d => (DIAS.find(x => x.v === d) || {}).c || d).join(", ")} · ${s.horaInicio || ""}${s.horaFin ? "–" + s.horaFin : ""}`;
  return `Diaria · ${s.horaInicio || ""}${s.horaFin ? "–" + s.horaFin : ""}`;
}
function renderAgendaGrid(sesionesAsignadas, duraciones, categorias, nombrePersona, clave){
  const rowh = 38;
  const horas = [];
  for (let h = HORA_INICIO; h <= HORA_FIN; h++) horas.push(h);
  const alturaTotal = (horas.length - 1) * rowh;
  const hoy = fechaISO(new Date());

  const columnas = DIAS.map(dia => {
    const bloques = [];
    const fechaDia = fechaDeSemana(dia.v, STATE.semanaOffset);
    sesionesAsignadas.forEach(s => {
      sesionOcurrenciasEnDia(s, dia.v).forEach(b => {
        const inicioMin = minutosDesde(b.horaInicio) - HORA_INICIO * 60;
        const duracionOverride = duraciones[s.id];
        const finMin = duracionOverride ? inicioMin + Number(duracionOverride)
          : (b.horaFin ? minutosDesde(b.horaFin) - HORA_INICIO * 60 : inicioMin + 60);
        const duracionMin = Math.max(finMin - inicioMin, 15);
        const horaFinTexto = minutosAHora(finMin + HORA_INICIO * 60);
        const top = Math.max(0, inicioMin) / 60 * rowh;
        const height = Math.max(finMin - inicioMin, 20) / 60 * rowh;
        const compacto = height < 24;
        const cat = CATEGORIAS[categorias[s.id]];
        const color = cat ? cat.color : COLOR_LIBRE;

        let check = "";
        let asistTxt = "";
        if (s.esActividad) {
          if (clave && fechaDia <= hoy) {
            const completado = buscarCompletadoActividad(clave, s._actividadId, fechaDia);
            check = `<span class="ab-check ${completado ? "ok" : "pend"}" onclick="event.stopPropagation(); marcarActividad('${esc(clave)}','${esc(s._actividadId)}','${fechaDia}')" title="${completado ? "Marcada como realizada — clic para quitar" : "Marcar como realizada"}">${completado ? "✓" : "○"}</span>`;
            asistTxt = completado ? " · marcada como realizada" : " · sin marcar";
          }
        } else if (nombrePersona && fechaDia <= hoy) {
          const asistio = !!buscarAsistencia(nombrePersona, s.id, fechaDia);
          check = `<span class="ab-check ${asistio ? "ok" : "no"}">${asistio ? "✓" : "✕"}</span>`;
          asistTxt = asistio ? " · asistió esta semana" : " · no registra asistencia esta semana";
        }
        const tooltip = `${s.nombre} — ${b.horaInicio}–${horaFinTexto} (${duracionMin} min)${cat ? " · " + cat.nombre : " · sin categorizar"}${asistTxt}`;
        bloques.push(`<div class="agenda-block${compacto ? " compacto" : ""}" style="top:${top}px;height:${height}px;background:${color};" title="${esc(tooltip)}">
          ${check}
          <span class="ab-nombre">${esc(s.nombre)}</span>
          ${compacto ? "" : `<div class="ab-hora">${esc(b.horaInicio)}–${esc(horaFinTexto)}</div>`}
        </div>`);
      });
    });
    return `<div class="agenda-daycol" style="height:${alturaTotal}px;">${bloques.join("")}</div>`;
  });

  return `
  <div class="week-nav">
    <button class="btn-secondary btn-sm" ${STATE.semanaOffset <= -1 ? "disabled" : ""} onclick="cambiarSemana(-1)">← Semana anterior</button>
    <span class="week-nav-label">${etiquetaSemana(STATE.semanaOffset)}</span>
    <button class="btn-secondary btn-sm" ${STATE.semanaOffset >= 0 ? "disabled" : ""} onclick="cambiarSemana(1)">Semana actual →</button>
  </div>
  <div class="agenda-grid" style="--rowh:${rowh}px;">
    <div class="ag-corner"></div>
    ${DIAS.map(d => `<div class="ag-head">${d.c}</div>`).join("")}
    <div class="ag-hours">${horas.map((h, i) => `<div class="ag-hourlabel" style="${i === horas.length - 1 ? "height:0;overflow:visible;border-top:none;" : ""}">${String(h).padStart(2, "0")}:00</div>`).join("")}</div>
    ${columnas.join("")}
  </div>
  <div class="cat-legend">
    ${Object.keys(CATEGORIAS).map(k => `<span class="cl-item"><span class="cl-dot" style="background:${CATEGORIAS[k].color};"></span>${CATEGORIAS[k].nombre}</span>`).join("")}
    <span class="cl-item"><span class="cl-dot" style="background:${COLOR_LIBRE};"></span>Sin categorizar</span>
  </div>`;
}
function duracionEfectiva(sesion, duraciones){
  if (duraciones[sesion.id]) return Number(duraciones[sesion.id]);
  if (sesion.horaInicio && sesion.horaFin) return Math.max(minutosDesde(sesion.horaFin) - minutosDesde(sesion.horaInicio), 15);
  return 60;
}

// ---------- Unifica sesiones reales (Control de Asistencia) + actividades configuradas acá ----------
function obtenerBloquesAsignados(clave){
  const asignacion = STATE.asignaciones[clave] || { sesionIds: [], duraciones: {}, categorias: {}, actividades: {} };
  const sesionesReales = STATE.sesiones.filter(s => asignacion.sesionIds.includes(s.id));

  const actividadesAsignadas = Object.keys(asignacion.actividades || {}).map(actId => {
    const act = STATE.actividadesCatalogo.find(a => a.id === actId);
    const cfg = asignacion.actividades[actId];
    if (!act || !cfg) return null;
    return {
      id: "act_" + actId, _actividadId: actId, nombre: act.nombre,
      frecuencia: "dias", dias: cfg.dias || [], horaInicio: cfg.horaInicio || "09:00", horaFin: "",
      esActividad: true,
    };
  }).filter(Boolean);

  const duraciones = { ...asignacion.duraciones };
  const categorias = { ...asignacion.categorias };
  actividadesAsignadas.forEach(a => {
    const cfg = asignacion.actividades[a._actividadId];
    duraciones[a.id] = cfg.duracion || 60;
    if (cfg.categoria) categorias[a.id] = cfg.categoria;
  });

  return { todas: [...sesionesReales, ...actividadesAsignadas], duraciones, categorias };
}

// ---------- Distribución de tiempo (gráfico araña) ----------
function calcularDistribucion(clave){
  const { todas: sesionesAsignadas, duraciones, categorias } = obtenerBloquesAsignados(clave);
  const totales = { objetivo: 0, procesos: 0, mejora: 0, personas: 0 };
  let totalContableMin = 0;

  Object.keys(VENTANA_CONTABLE).forEach(dia => {
    const ventana = VENTANA_CONTABLE[dia];
    const ventanaInicio = minutosDesde(ventana.inicio);
    const ventanaFin = minutosDesde(ventana.fin);
    totalContableMin += (ventanaFin - ventanaInicio);

    sesionesAsignadas.forEach(s => {
      const cat = categorias[s.id];
      if (!cat || !CATEGORIAS[cat]) return;
      sesionOcurrenciasEnDia(s, dia).forEach(b => {
        const inicioMin = minutosDesde(b.horaInicio);
        const duracionOverride = duraciones[s.id];
        const finMin = duracionOverride ? inicioMin + Number(duracionOverride)
          : (b.horaFin ? minutosDesde(b.horaFin) : inicioMin + 60);
        const inicioClip = Math.max(inicioMin, ventanaInicio);
        const finClip = Math.min(finMin, ventanaFin);
        if (finClip > inicioClip) totales[cat] += (finClip - inicioClip);
      });
    });
  });

  const ocupado = totales.objetivo + totales.procesos + totales.mejora + totales.personas;
  const libreMin = Math.max(totalContableMin - ocupado, 0);
  const pct = (min) => totalContableMin ? Math.round((min / totalContableMin) * 1000) / 10 : 0;
  return {
    objetivo: pct(totales.objetivo), procesos: pct(totales.procesos),
    mejora: pct(totales.mejora), personas: pct(totales.personas), libre: pct(libreMin),
  };
}
function calcularAdherencia(clave, nombrePersona, offsetSemanas){
  const { todas } = obtenerBloquesAsignados(clave);
  const bloques = todas.filter(s => s.frecuencia !== "unica");
  const hoy = fechaISO(new Date());
  const claveN = claveNombreCompat(nombrePersona);
  let total = 0, cumplidas = 0;
  DIAS.forEach(dia => {
    const fecha = fechaDeSemana(dia.v, offsetSemanas);
    if (fecha > hoy) return;
    bloques.forEach(s => {
      sesionOcurrenciasEnDia(s, dia.v).forEach(() => {
        total++;
        if (s.esActividad) {
          if (buscarCompletadoActividad(clave, s._actividadId, fecha)) cumplidas++;
        } else if (buscarAsistencia(nombrePersona, s.id, fecha)) {
          cumplidas++;
        }
      });
    });
  });
  return total ? Math.round((cumplidas / total) * 1000) / 10 : null;
}
function nombreDiaSemana(fecha){
  const dias = ["domingo", "lunes", "martes", "miercoles", "jueves", "viernes", "sabado"];
  return dias[fecha.getDay()];
}
function calcularAdherenciaMes(clave, nombrePersona){
  const { todas } = obtenerBloquesAsignados(clave);
  const bloques = todas.filter(s => s.frecuencia !== "unica");
  const claveN = claveNombreCompat(nombrePersona);
  const hoy = new Date();
  const cursor = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
  let total = 0, cumplidas = 0;
  while (cursor <= hoy) {
    const diaTxt = nombreDiaSemana(cursor);
    const fecha = fechaISO(cursor);
    bloques.forEach(s => {
      sesionOcurrenciasEnDia(s, diaTxt).forEach(() => {
        total++;
        if (s.esActividad) {
          if (buscarCompletadoActividad(clave, s._actividadId, fecha)) cumplidas++;
        } else if (buscarAsistencia(nombrePersona, s.id, fecha)) {
          cumplidas++;
        }
      });
    });
    cursor.setDate(cursor.getDate() + 1);
  }
  return total ? Math.round((cumplidas / total) * 1000) / 10 : null;
}

// ---------- Tendencia de adherencia (semanas anteriores) ----------
async function calcularTendencia(clave, nombrePersona, semanas){
  const l0 = lunesDeSemana(0);
  const inicioRango = fechaISO(lunesDeSemana(-(semanas - 1)));
  const finRango = fechaISO(new Date(l0.getFullYear(), l0.getMonth(), l0.getDate() + 6));

  const [snapReg, snapComp] = await Promise.all([
    getDocs(query(collection(dbAsistencia, "registrosAsistencia"), where("fecha", ">=", inicioRango), where("fecha", "<=", finRango))),
    getDocs(query(collection(db, "completadosActividad"), where("fecha", ">=", inicioRango), where("fecha", "<=", finRango))),
  ]);
  const registros = snapReg.docs.map(d => d.data());
  const completados = snapComp.docs.map(d => d.data()).filter(c => c.clave === clave);
  const claveN = claveNombreCompat(nombrePersona);

  const { todas } = obtenerBloquesAsignados(clave);
  const bloques = todas.filter(s => s.frecuencia !== "unica");
  const hoy = fechaISO(new Date());

  const resultado = [];
  for (let i = semanas - 1; i >= 0; i--) {
    const lunesSemana = lunesDeSemana(-i);
    let total = 0, cumplidas = 0;
    DIAS.forEach(dia => {
      const idx = DIAS.findIndex(d => d.v === dia.v);
      const fecha = fechaISO(new Date(lunesSemana.getFullYear(), lunesSemana.getMonth(), lunesSemana.getDate() + idx));
      if (fecha > hoy) return;
      bloques.forEach(s => {
        sesionOcurrenciasEnDia(s, dia.v).forEach(() => {
          total++;
          if (s.esActividad) {
            if (completados.find(c => c.actividadId === s._actividadId && c.fecha === fecha)) cumplidas++;
          } else if (registros.find(r => r.sesionId === s.id && r.fecha === fecha && claveNombreCompat(r.nombre) === claveN)) {
            cumplidas++;
          }
        });
      });
    });
    resultado.push({ semana: lunesSemana, pct: total ? Math.round((cumplidas / total) * 1000) / 10 : null });
  }
  return resultado;
}

    mejora: leer("target-mejora"), personas: leer("target-personas"), libre: leer("target-libre"),
  };
  const suma = target.objetivo + target.procesos + target.mejora + target.personas + target.libre;
  if (Math.abs(suma - 100) > 0.5) {
    if (!confirm(`Los porcentajes suman ${suma}%, no 100%. ¿Guardar igual?`)) return;
  }
  await fbSetDoc("asignaciones", clave, { target });
};
window.actualizarBusqueda = (valor) => { STATE.search = valor; render(); };
window.recargarSesiones = async (btn) => {
  if (btn) { btn.disabled = true; btn.textContent = "Actualizando…"; }
  try {
    const snap = await getDocs(collection(dbAsistencia, "sesionesAsistencia"));
    const todas = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(s => s.activa !== false);
    STATE.sesiones = todas.filter(s => s.tipo !== "actividad");
    STATE.actividadesCatalogo = todas.filter(s => s.tipo === "actividad");
    render();
  } catch (e) {
    alert("No se pudo actualizar el catálogo de reuniones: " + e.message);
  }
  if (btn) { btn.disabled = false; btn.textContent = "🔄 Actualizar catálogo de reuniones y actividades"; }
};

async function agregarOrg(){
  const id = "org_" + Date.now();
  await fbSetDoc("organigrama", id, { nombre: "Nuevo cargo", cargo: "", parentId: null, orden: Date.now() });
}
async function eliminarOrg(id){
  if (!confirm("¿Eliminar este cargo del organigrama? También se pierde su agenda asignada.")) return;
  await fbDeleteDoc("organigrama", id);
  await fbDeleteDoc("asignaciones", claveDe("comite", id));
}
async function moverOrg(id, direccion){
  const nodo = STATE.organigrama.find(n => n.id === id);
  if (!nodo) return;
  let hermanos = STATE.organigrama.filter(n => n.parentId === nodo.parentId).slice()
    .sort((a, b) => (a.orden || 0) - (b.orden || 0) || String(a.id).localeCompare(String(b.id)));
  const idx = hermanos.findIndex(n => n.id === id);
  const idxVecino = direccion === "izq" ? idx - 1 : idx + 1;
  if (idxVecino < 0 || idxVecino >= hermanos.length) return;
  [hermanos[idx], hermanos[idxVecino]] = [hermanos[idxVecino], hermanos[idx]];
  await Promise.all(hermanos.map((h, i) => fbSetDoc("organigrama", h.id, { orden: i })));
}
async function agregarPersona(nivel){
  const id = "per_" + Date.now();
  await fbSetDoc("personas", id, { nombre: "Nueva persona", cargo: "", nivel });
}
async function eliminarPersona(id, nivel){
  if (!confirm("¿Eliminar esta persona del listado? También se pierde su agenda asignada.")) return;
  await fbDeleteDoc("personas", id);
  await fbDeleteDoc("asignaciones", claveDe(nivel, id));
}

function abrirAgenda(nivel, id){
  let nombre, cargo;
  if (nivel === "comite-general") {
    nombre = "Comité Ejecutivo"; cargo = "Sesiones generales";
  } else if (nivel === "comite") {
    const n = STATE.organigrama.find(x => x.id === id);
    if (!n) return;
    nombre = n.nombre; cargo = n.cargo;
  } else {
    const p = STATE.personas.find(x => x.id === id);
    if (!p) return;
    nombre = p.nombre; cargo = p.cargo;
  }
  STATE.personaAbierta = { nivel, id, nombre, cargo };
  STATE.semanaOffset = 0;
  STATE.tendenciaDatos = null;
  render();
}
window.cambiarSemana = (delta) => {
  const nuevo = STATE.semanaOffset + delta;
  if (nuevo < -1 || nuevo > 0) return;
  STATE.semanaOffset = nuevo;
  render();
};
function cerrarModal(){ STATE.modal = null; STATE.modalNivel = null; STATE.personaAbierta = null; STATE.semanaOffset = 0; STATE.tendenciaDatos = null; render(); }

window.alternarModoEdicion = () => {
  if (STATE.modoEdicion) { STATE.modoEdicion = false; render(); return; }
  STATE.modal = "clave";
  render();
};
async function confirmarClave(){
  const input = document.getElementById("claveInput");
  const valor = input.value;
  const cfg = await fbGetDoc("config", "eo");
  if (cfg && valor === cfg.clave) {
    STATE.modoEdicion = true;
    STATE.modal = null;
    render();
  } else {
    document.getElementById("claveError").textContent = "Clave incorrecta.";
  }
}
window.cambiarClave = async () => {
  const actual = prompt("Escribe la clave ACTUAL de Excelencia para confirmar el cambio:");
  if (actual === null) return;
  const cfg = await fbGetDoc("config", "eo");
  if (!cfg || actual !== cfg.clave) { alert("Clave actual incorrecta."); return; }
  const nueva = prompt("Escribe la NUEVA clave:");
  if (!nueva) return;
  await fbSetDoc("config", "eo", { clave: nueva });
  alert("Clave actualizada correctamente.");
};

function handleAction(action, el){
  switch (action) {
    case "ir-nivel": STATE.nivelActivo = el.dataset.nivel; STATE.search = ""; render(); break;
    case "abrir-agenda": abrirAgenda(el.dataset.nivel, el.dataset.id); break;
    case "cerrar-modal": cerrarModal(); break;
    case "abrir-editar-organigrama": STATE.modal = "editar-organigrama"; render(); break;
    case "abrir-editar-lista": STATE.modal = "editar-lista"; STATE.modalNivel = el.dataset.nivel; render(); break;
    case "agregar-org": agregarOrg(); break;
    case "eliminar-org": eliminarOrg(el.dataset.id); break;
    case "mover-org": moverOrg(el.dataset.id, el.dataset.dir); break;
    case "agregar-persona": agregarPersona(el.dataset.nivel); break;
    case "eliminar-persona": eliminarPersona(el.dataset.id, STATE.modalNivel); break;
    case "confirmar-clave": confirmarClave(); break;
  }
}
function attachHandlers(){
  document.querySelectorAll("[data-action]").forEach(el => {
    el.onclick = (e) => { e.stopPropagation(); handleAction(el.dataset.action, el); };
  });
  const ov = document.getElementById("ovModal");
  if (ov) ov.addEventListener("click", (e) => { if (e.target === ov) cerrarModal(); });

  if (window.__focoPendiente) {
    const el = document.getElementById(window.__focoPendiente.id);
    if (el) {
      if (el.value !== window.__focoPendiente.valor) el.value = window.__focoPendiente.valor;
      el.focus();
      if (el.setSelectionRange && el.type !== "number") { try { el.setSelectionRange(window.__focoPendiente.pos, window.__focoPendiente.pos); } catch (e) {} }
    }
    window.__focoPendiente = null;
  }
  if (window.__scrollModalBody != null) {
    const mb = document.querySelector("#ovModal .modal-body");
    if (mb) mb.scrollTop = window.__scrollModalBody;
    window.__scrollModalBody = null;
  }
  if (window.__scrollAsignarList != null) {
    const al = document.querySelector("#ovModal .asignar-list");
    if (al) al.scrollTop = window.__scrollAsignarList;
    window.__scrollAsignarList = null;
  }

  if (STATE.personaAbierta && STATE.modal !== "tendencia") {
    dibujarRadar(claveDe(STATE.personaAbierta.nivel, STATE.personaAbierta.id));
  }
  if (STATE.modal === "tendencia" && STATE.tendenciaDatos) {
    dibujarTendencia();
  }
}
</script>
