<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica · Modelo de Excelencia Operacional</title>
<style>
  :root{
    --oems-teal:#009899; --oems-teal-dark:#046566;
    --oems-beige:#D1BF99; --oems-beige-dark:#8C7A4E;
    --oems-terra:#C04F15; --oems-terra-dark:#7A310D;
    --oems-graphite:#2C2C2A; --oems-graphite-dark:#141412;
    --gray-900:#2C2C2A; --gray-700:#444441; --warm-gray-500:#5F5E5A;
    --warm-gray-300:#B4B2A9; --warm-gray-100:#D3D1C7; --warm-gray-50:#F1EFE8;
    --green-500:#0F6E56; --green-50:#E1F5EE;
    --amber-500:#BA7517; --amber-50:#FAEEDA;
    --red-600:#993C1D; --red-50:#FAECE7;
    --white:#FFFFFF;
    --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --font-body:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); background:var(--warm-gray-50); color:var(--gray-900); line-height:1.5;}

  header{background:var(--white); border-bottom:1px solid var(--warm-gray-100);}
  .header-inner{max-width:980px; margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .crumb{font-size:12.5px; color:var(--warm-gray-500);}
  .crumb a{color:var(--oems-teal); text-decoration:none; font-weight:600;}
  .approvals-link{font-size:12px; color:var(--warm-gray-500); text-decoration:none; white-space:nowrap;}
  .approvals-link:hover{color:var(--oems-teal);}

  main{max-width:980px; margin:0 auto; padding:34px 32px 90px;}

  .practice-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:30px; flex-wrap:wrap;}
  .pilar-tag{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em;
    display:inline-flex; align-items:center; gap:6px; margin-bottom:8px;
  }
  .dot{width:8px; height:8px; border-radius:100px;}
  .practice-head h1{font-family:var(--font-display); font-size:24px; font-weight:700; max-width:560px;}

  .btn-primary{
    background:var(--oems-teal); color:#fff; border:none; padding:13px 22px; border-radius:10px;
    font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .btn-primary:hover{filter:brightness(0.9);}

  .panel{background:#fff; border:1px solid var(--warm-gray-100); border-radius:14px; padding:24px; margin-bottom:22px;}
  .panel h2{font-family:var(--font-display); font-size:14.5px; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .panel h2 svg{width:17px; height:17px; color:var(--oems-teal);}
  .panel p{font-size:13.5px; color:var(--gray-700);}

  .video-box{
    background:var(--gray-900); border-radius:10px; aspect-ratio:16/9; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.6); font-size:12.5px; margin-bottom:14px;
  }
  .video-box svg{width:36px; height:36px; opacity:0.7;}
  .video-box.has-video{
    background:linear-gradient(135deg, var(--oems-teal), var(--oems-teal-dark)); flex-direction:column; gap:10px; cursor:pointer;
    text-decoration:none; aspect-ratio:auto; padding:32px 20px;
  }
  .video-box.has-video svg{width:44px; height:44px; opacity:1; color:#fff;}
  .video-box.has-video span{color:#fff; font-weight:700; font-size:13.5px;}

  .resource-list{display:flex; flex-direction:column; gap:8px;}
  .resource{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--warm-gray-100); border-radius:9px;
    font-size:12.5px; font-weight:600; text-decoration:none; color:var(--gray-900);
  }
  .resource:hover{border-color:var(--oems-teal);}
  .resource svg{width:16px; height:16px; color:var(--oems-teal); flex-shrink:0;}
  .resource .r-sub{font-weight:400; color:var(--warm-gray-500); margin-left:auto; font-size:11px;}

  .hist-row{
    display:grid; grid-template-columns:100px 1fr 130px 100px; gap:12px; align-items:center;
    padding:12px 4px; border-bottom:1px solid var(--warm-gray-50); font-size:12.5px;
  }
  .hist-row.head{font-weight:700; color:var(--warm-gray-500); font-size:11px; text-transform:uppercase; letter-spacing:0.03em;}
  .hist-date{color:var(--warm-gray-500);}
  .hist-desc b{display:block; font-size:12.5px;}
  .hist-desc span{color:var(--warm-gray-500); font-size:11.5px;}
  .status{font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:100px; width:fit-content;}
  .status-pending{background:var(--amber-50); color:var(--amber-500);}
  .status-approved{background:var(--green-50); color:var(--green-500);}
  .status-rejected{background:var(--red-50); color:var(--red-600);}
  .hist-evidence{color:var(--oems-teal); font-weight:600; text-decoration:none; font-size:12px;}
  .hist-empty{font-size:12.5px; color:var(--warm-gray-500); padding:16px 4px; text-align:center;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,52,44,0.45); display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{background:#fff; border-radius:16px; width:100%; max-width:460px; padding:26px; max-height:90vh; overflow-y:auto;}
  .modal h3{font-family:var(--font-display); font-size:16.5px; font-weight:700; margin-bottom:4px;}
  .modal .modal-sub{font-size:12px; color:var(--warm-gray-500); margin-bottom:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; margin-bottom:6px;}
  .field input, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--warm-gray-100); border-radius:8px; font-size:13px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .btn-secondary{background:var(--warm-gray-50); color:var(--gray-700); border:none; padding:11px 18px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; flex:1;}
  .btn-primary.full{flex:1;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="crumb"><a href="index.html">Excelencia Operacional</a> / <a href="modelo-listado.html">Modelo de Excelencia</a> / <span id="crumbActual">Práctica</span></div>
    <a href="modelo-aprobaciones.html" class="approvals-link">Ver bandeja de aprobaciones →</a>
  </div>
</header>

<main>

  <div class="practice-head">
    <div>
      <div class="pilar-tag" id="pilarTag"><span class="dot" id="pilarDot"></span><span id="pilarNombre">Pilar</span></div>
      <h1 id="practiceTitle">Práctica</h1>
    </div>
    <button class="btn-primary" onclick="document.getElementById('modalRegistro').classList.add('open')">+ Registrar práctica realizada</button>
  </div>

  <div class="panel">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>Definición y propósito</h2>
    <p id="practiceDef">Cargando...</p>
  </div>

  <div class="panel">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>Material de capacitación</h2>
    <div id="videoBox" class="video-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
    </div>
    <div class="resource-list" id="materialesList"></div>
  </div>

  <div class="panel">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15v6M9 21h6"/><rect x="4" y="3" width="16" height="12" rx="2"/></svg>Formato descargable</h2>
    <div class="resource-list" id="plantillaList"></div>
  </div>

  <div class="panel">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3v18h18"/><path d="M7 15l3-4 3 3 5-7"/></svg>Historial de registros</h2>
    <div class="hist-row head">
      <div>Fecha</div><div>Descripción</div><div>Estado</div><div>Evidencia</div>
    </div>
    <div id="historialList"></div>
  </div>

</main>

<div class="modal-overlay" id="modalRegistro">
  <div class="modal">
    <h3>Registrar práctica realizada</h3>
    <div class="modal-sub" id="modalSub">Práctica</div>
    <div class="field"><label>Fecha</label><input type="date"></div>
    <div class="field"><label>Descripción de lo realizado</label><textarea placeholder="Describe brevemente lo realizado..."></textarea></div>
    <div class="field"><label>Evidencia (archivo o link)</label><input type="text" placeholder="Adjuntar archivo o pegar link"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="document.getElementById('modalRegistro').classList.remove('open')">Cancelar</button>
      <button class="btn-primary full" onclick="document.getElementById('modalRegistro').classList.remove('open')">Enviar para aprobación</button>
    </div>
  </div>
</div>

<script>
const PILARES = {
  personas:  { nombre: 'Desarrollo de Personas',  color: 'var(--oems-teal-dark)' },
  objetivo:  { nombre: 'Objetivo Común',           color: 'var(--oems-beige-dark)' },
  mejora:    { nombre: 'Mejora Continua',          color: 'var(--oems-terra-dark)' },
  procesos:  { nombre: 'Procesos Eficientes',      color: 'var(--oems-graphite)' },
};

const PRACTICAS = {
  'feedback-coaching': {
    nombre: 'Feedback & Coaching', pilar: 'personas',
    definicion: 'Conversaciones estructuradas de retroalimentación entre líder y colaborador, orientadas a reconocer avances y acordar planes de acción concretos para el desarrollo individual.',
    materiales: [{n:'Guía de conversación de Feedback & Coaching', t:'PDF · 0.9 MB'}, {n:'Video de capacitación: cómo dar feedback efectivo', t:'Video · 6 min'}],
    plantilla: 'Plantilla de registro de sesión de Coaching (Excel)',
    historial: [
      {fecha:'12 ago 2026', resp:'Camila Torres', desc:'Sesión mensual de feedback con 4 integrantes del turno B.', estado:'approved'},
      {fecha:'05 ago 2026', resp:'Luis Fernández', desc:'Feedback individual sobre cumplimiento de estándares de seguridad.', estado:'pending'},
    ]
  },
  'confirmacion-rol': {
    nombre: 'Confirmación de Rol/Procesos', pilar: 'personas',
    definicion: 'Verificación periódica de que cada persona del equipo comprende su rol, sus responsabilidades y los procesos operativos que le aplican, evitando desviaciones por desconocimiento.',
    materiales: [{n:'Checklist de confirmación de rol', t:'PDF · 0.6 MB'}, {n:'Presentación de inducción de procesos', t:'PPTX · 3.1 MB'}],
    plantilla: 'Plantilla de confirmación de rol y procesos (Word)',
    historial: [
      {fecha:'10 ago 2026', resp:'Marcela Díaz', desc:'Confirmación de rol para 2 nuevos ingresos del área de mantención.', estado:'approved'},
    ]
  },
  'alineacion-estrategica': {
    nombre: 'Alineación Estratégica', pilar: 'objetivo',
    definicion: 'Proceso para conectar los objetivos del equipo con la estrategia general del sitio, asegurando que cada área entienda cómo su trabajo diario contribuye a las metas de Lomas Bayas.',
    video: 'https://glencore.sharepoint.com/:v:/r/sites/CLModeloEOCapacitaciones/Shared%20Documents/General/01%20-%20Alineacion%20Estrategica/GLENCORE_LEM_PRACTICA_1.mp4?d=we548cdf235604cfb9a5f7abb730c1cce&csf=1&web=1',
    materiales: [{n:'Mapa de objetivos estratégicos del sitio', t:'PDF · 1.4 MB'}, {n:'Video: cómo alinear metas de equipo', t:'Video · 8 min'}],
    plantilla: 'Plantilla de despliegue de objetivos (Excel)',
    historial: [
      {fecha:'14 ago 2026', resp:'Ana Rojas', desc:'Taller de despliegue de objetivos trimestrales con el equipo de planta.', estado:'approved'},
      {fecha:'01 ago 2026', resp:'Jorge Muñoz', desc:'Revisión de alineación de metas del área de mantención.', estado:'approved'},
    ]
  },
  'full-potential': {
    nombre: 'Full Potential', pilar: 'objetivo',
    definicion: 'Definición y seguimiento del máximo potencial esperado por área o proceso, estableciendo una brecha visible entre el desempeño actual y el óptimo alcanzable.',
    materiales: [{n:'Guía de cálculo de Full Potential', t:'PDF · 1.1 MB'}],
    plantilla: 'Plantilla de análisis de brecha (Excel)',
    historial: []
  },
  'visualizar-progreso': {
    nombre: 'Visualizar y Gestionar el Progreso', pilar: 'objetivo',
    definicion: 'Uso de tableros visuales en terreno para hacer seguimiento diario o semanal del avance del equipo frente a sus metas, facilitando la toma de decisiones oportuna.',
    materiales: [{n:'Guía de gestión visual en terreno', t:'PDF · 1.7 MB'}, {n:'Video: montaje de un tablero de gestión visual', t:'Video · 5 min'}],
    plantilla: 'Plantilla de tablero de gestión visual (PDF imprimible)',
    historial: [
      {fecha:'13 ago 2026', resp:'Pedro Salas', desc:'Actualización semanal del tablero de gestión visual de chancado.', estado:'approved'},
    ]
  },
  'identificacion-mejoras': {
    nombre: 'Identificación de Mejoras', pilar: 'mejora',
    definicion: 'Detección temprana de oportunidades de mejora en terreno, a partir de la observación directa, datos operativos o retroalimentación del equipo.',
    materiales: [{n:'Guía de identificación de oportunidades de mejora', t:'PDF · 0.8 MB'}],
    plantilla: 'Plantilla de registro de oportunidad de mejora (Excel)',
    historial: [
      {fecha:'11 ago 2026', resp:'Camila Torres', desc:'Identificación de mejora en flujo de despacho de camiones.', estado:'pending'},
    ]
  },
  'resolucion-problemas': {
    nombre: 'Resolución de Problemas', pilar: 'mejora',
    definicion: 'Metodología estructurada para identificar la causa raíz de un problema recurrente y aplicar una solución sostenible, en vez de corregir únicamente el síntoma. Su propósito es evitar que un mismo problema vuelva a ocurrir, fortaleciendo la capacidad del equipo de resolver desviaciones de forma autónoma y basada en datos.',
    materiales: [{n:'Guía metodológica: 5 Porqués y Espina de Pescado', t:'PDF · 1.2 MB'}, {n:'Presentación de capacitación completa', t:'PPTX · 4.8 MB'}],
    plantilla: 'Plantilla de Resolución de Problemas (Excel)',
    historial: [
      {fecha:'14 ago 2026', resp:'Ana Rojas', desc:'Se resolvió recurrencia de detención en chancado primario.', estado:'approved'},
      {fecha:'08 ago 2026', resp:'Pedro Salas', desc:'Análisis de causa raíz para fallas en bomba de proceso.', estado:'pending'},
      {fecha:'02 ago 2026', resp:'Marcela Díaz', desc:'Reincidencia de desviación en calidad de mineral.', estado:'rejected'},
    ]
  },
  'gestion-iniciativas': {
    nombre: 'Gestión de Iniciativas', pilar: 'mejora',
    definicion: 'Seguimiento de iniciativas de mejora desde su origen hasta su cierre, asegurando responsables, plazos y verificación de resultados.',
    materiales: [{n:'Guía de gestión de iniciativas', t:'PDF · 1.0 MB'}],
    plantilla: 'Plantilla de seguimiento de iniciativas (Excel)',
    historial: [
      {fecha:'09 ago 2026', resp:'Luis Fernández', desc:'Cierre de iniciativa de reducción de tiempos de detención no programada.', estado:'approved'},
    ]
  },
  'agenda': {
    nombre: 'Agenda', pilar: 'procesos',
    definicion: 'Organización y priorización del tiempo del equipo de liderazgo, asegurando espacio dedicado a las prácticas del modelo y no solo a la contingencia diaria.',
    materiales: [{n:'Guía de construcción de agenda de liderazgo', t:'PDF · 0.7 MB'}],
    plantilla: 'Plantilla de agenda semanal (Excel)',
    historial: [
      {fecha:'15 ago 2026', resp:'Jorge Muñoz', desc:'Actualización de agenda semanal del equipo de mantención.', estado:'pending'},
      {fecha:'08 ago 2026', resp:'Ana Rojas', desc:'Revisión de agenda mensual de liderazgo de planta.', estado:'approved'},
    ]
  },
  'procedimientos-operativos': {
    nombre: 'Procedimientos Operativos y Trabajo Estandarizado', pilar: 'procesos',
    definicion: 'Documentación y verificación del cumplimiento de procedimientos operativos estándar, asegurando consistencia en la forma en que se ejecutan las tareas críticas del sitio.',
    materiales: [{n:'Guía de trabajo estandarizado', t:'PDF · 1.3 MB'}, {n:'Video: cómo documentar un procedimiento', t:'Video · 7 min'}],
    plantilla: 'Plantilla de procedimiento operativo estándar (Word)',
    historial: [
      {fecha:'07 ago 2026', resp:'Pedro Salas', desc:'Actualización de procedimiento de arranque de chancado.', estado:'approved'},
    ]
  },
};

const params = new URLSearchParams(window.location.search);
const slug = params.get('p') || 'resolucion-problemas';
const practica = PRACTICAS[slug] || PRACTICAS['resolucion-problemas'];
const pilar = PILARES[practica.pilar];

document.getElementById('crumbActual').textContent = practica.nombre;
document.getElementById('practiceTitle').textContent = practica.nombre;
document.getElementById('practiceDef').textContent = practica.definicion;
document.getElementById('pilarNombre').textContent = pilar.nombre;
document.getElementById('pilarTag').style.color = pilar.color;
document.getElementById('pilarDot').style.background = pilar.color;
document.getElementById('modalSub').textContent = practica.nombre;
document.title = practica.nombre + ' · Modelo de Excelencia Operacional';

const matEl = document.getElementById('materialesList');
const videoBox = document.getElementById('videoBox');
if (practica.video) {
  videoBox.outerHTML = `<a id="videoBox" class="video-box has-video" href="${practica.video}" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>
    <span>Ver video de capacitación ↗</span>
  </a>`;
}
practica.materiales.forEach(m => {
  matEl.innerHTML += `<a class="resource" href="#" onclick="return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    ${m.n}<span class="r-sub">${m.t}</span>
  </a>`;
});

document.getElementById('plantillaList').innerHTML = `<a class="resource" href="#" onclick="return false;">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3M6 15l6 6 6-6M4 21h16"/></svg>
  ${practica.plantilla}<span class="r-sub">Descargar</span>
</a>`;

const histEl = document.getElementById('historialList');
const statusLabel = {approved:'Aprobado', pending:'Pendiente', rejected:'Rechazado'};
if (practica.historial.length === 0) {
  histEl.innerHTML = '<div class="hist-empty">Aún no hay registros para esta práctica.</div>';
} else {
  practica.historial.forEach(h => {
    histEl.innerHTML += `<div class="hist-row">
      <div class="hist-date">${h.fecha}</div>
      <div class="hist-desc"><b>${h.resp}</b><span>${h.desc}</span></div>
      <div class="status status-${h.estado}">${statusLabel[h.estado]}</div>
      <a class="hist-evidence" href="#">Ver →</a>
    </div>`;
  });
}
</script>

</body>
</html>
