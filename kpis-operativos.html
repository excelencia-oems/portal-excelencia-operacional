<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resumen KPIs Operativos | Portal EO</title>
<style>
:root{--bg:#F1EFE8;--surface:#FFFFFF;--line:#D3D1C7;--text:#2C2C2A;--muted:#5F5E5A;--teal:#0F6E56;--teal-800:#085041;--font-display:"Archivo","Helvetica Neue",Arial,sans-serif;--font-body:"Inter","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding:20px 20px 32px}
.top{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;border-bottom:4px solid var(--teal-800);padding-bottom:12px;margin-bottom:16px}
.volver{display:inline-block;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:6px}
.volver:hover{color:var(--teal)}
.btn2{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 14px;border-radius:6px;text-decoration:none;font-weight:500;white-space:nowrap}
.btn2:hover{border-color:var(--teal)}
.cargando{margin:0 0 8px;min-height:1.2em;color:var(--muted);font-size:.88rem}
[hidden]{display:none!important}
.rango{display:flex;gap:6px;align-items:center}
.rango span{color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.1}
.sub{margin:4px 0 0;color:var(--muted);font-size:.93rem}
.filtros{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(140px,1fr) minmax(180px,1.3fr) auto minmax(190px,.9fr) auto;gap:12px;align-items:end;margin-bottom:14px}
label,.lbl{display:block;font-size:.84rem;color:var(--muted);margin-bottom:4px}
select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);font:inherit}
#selKpi{border:2px solid var(--teal);font-weight:600;padding:7px 10px}
.segmento{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.segmento button{border:0;background:transparent;padding:8px 12px;cursor:pointer;font:inherit;color:var(--text)}
.segmento button[aria-pressed="true"]{background:var(--teal);color:#fff}
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;padding:8px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.marco{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;width:100%;aspect-ratio:16 / 9.4;min-height:460px;max-height:calc(100vh - 230px)}
.marco iframe{display:block;width:100%;height:100%;border:0}
@media (max-width:1000px){.filtros{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <a class="volver" href="index.html" id="lnkVolver">Volver al Portal EO</a>
  <header class="top">
    <div>
      <h1>Resumen KPIs Operativos</h1>
      <p class="sub">Real contra plan por equipo y flota. Elige los filtros y presiona Aplicar. Se muestra con tu cuenta Glencore.</p>
    </div>
    <a class="btn2" id="lnkPestana" target="_blank" rel="noopener">Abrir en pestaña nueva</a>
  </header>
  <p class="cargando" id="cargando" role="status" aria-live="polite"></p>

  <section class="filtros" aria-label="Filtros">
    <div><label for="selKpi">KPI</label><select id="selKpi"></select></div>
    <div><label for="selProceso">Proceso</label><select id="selProceso"></select></div>
    <div><label for="selEquipo">Equipo o flota</label><select id="selEquipo"></select></div>
    <div>
      <span class="lbl" id="lblVista">Vista</span>
      <div class="segmento" role="group" aria-labelledby="lblVista" id="segVista">
        <button type="button" data-v="Mes" aria-pressed="true">Mensual</button>
        <button type="button" data-v="Trimestre" aria-pressed="false">Trimestral</button>
        <button type="button" data-v="Año" aria-pressed="false">Anual</button>
      </div>
    </div>
    <div><span class="lbl">Años</span><div class="rango"><select id="selDesde" aria-label="Desde el año"></select><span>a</span><select id="selHasta" aria-label="Hasta el año"></select></div></div>
    <div><button class="btn" id="btnAplicar">Aplicar</button></div>
  </section>

  <div class="marco"><iframe id="informe" title="Resumen KPIs Operativos" allowfullscreen></iframe></div>
</div>

<script>
/* ============ CONFIGURACIÓN ============ */
const POWERBI = {
  reportId: "e3135659-52d1-4b24-bbad-6148ee15b7c0",
  tenantId: "c9a8e948-bf0d-4f8d-9e9d-551ac1b45a48",
  tabla: "tbl_kpi1"        // nombre de la tabla tal como aparece en el panel Datos de Power BI
};

const KPIS = [["Availability","%"],["UoA","%"],["Metrica","ton"],["Metrica","m"],["Metrica","kt"],["Rendimiento Op","tph"],["Rendimiento Op","m/h"]];
const EQUIPOS = {
  "Carguío": [["Carguío","Total"],["P&H 2800","Flota"],["P&H 4100","Flota"],["PC 7000","Flota"],["PC 8000","Flota"],["PC 5500","Flota"],["CF 994","Flota"],
              ["Pala 201","Equipo"],["Pala 202","Equipo"],["Pala 203","Equipo"],["Pala 204","Equipo"],["Pala 205","Equipo"],["Pala 206","Equipo"],["Pala 210","Equipo"],["CF 304","Equipo"],["CF 307","Equipo"]],
  "Transporte": [["Transporte","Total"],["Caex KOM 930 E5","Flota"],["Caex KOM 930 E5 AT","Flota"],["Caex CAT 793F","Flota"]],
  "Perforación": [["Perforación","Total"],["Producción","Flota"],["Precorte","Flota"],["CAT-MD6540","Flota"],["CAT-MD6420","Flota"],["Pit Viper 275","Flota"],["Atlas Rocl8","Flota"],["Sandvik","Flota"],
                  ["DR05","Equipo"],["DR06","Equipo"],["DR07","Equipo"],["DR08","Equipo"],["DR09","Equipo"],["DR10","Equipo"],["DR11","Equipo"],["DR12","Equipo"],["DR13","Equipo"],["DR14","Equipo"],["DR15","Equipo"]],
  "Chancado": [["Chancado Primario","Total"],["Chancador Lomas 1","Equipo"],["Chancador Lomas 2","Equipo"]]
};
const ANIOS = [2022, 2023, 2024, 2025];

/* ============ CONTROLES ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let vista = "Mes";

$("selKpi").innerHTML = KPIS.map(([k, u], i) => `<option value="${i}">${esc(k)} (${esc(u)})</option>`).join("");
$("selProceso").innerHTML = Object.keys(EQUIPOS).map(p => `<option>${esc(p)}</option>`).join("");
$("selDesde").innerHTML = ANIOS.map(a => `<option>${a}</option>`).join("");
$("selHasta").innerHTML = $("selDesde").innerHTML;
$("selDesde").value = ANIOS[ANIOS.length - 2];
$("selHasta").value = ANIOS[ANIOS.length - 1];
// evita rangos invertidos
$("selDesde").addEventListener("change", () => { if (+$("selDesde").value > +$("selHasta").value) $("selHasta").value = $("selDesde").value; });
$("selHasta").addEventListener("change", () => { if (+$("selHasta").value < +$("selDesde").value) $("selDesde").value = $("selHasta").value; });

function llenarEquipos(){
  const lista = EQUIPOS[$("selProceso").value];
  const grupos = ["Total", "Flota", "Equipo"].map(cat => {
    const items = lista.filter(e => e[1] === cat);
    return items.length ? `<optgroup label="${cat}">${items.map(e => `<option>${esc(e[0])}</option>`).join("")}</optgroup>` : "";
  });
  $("selEquipo").innerHTML = grupos.join("");
}
$("selProceso").addEventListener("change", llenarEquipos);
$("segVista").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  vista = b.dataset.v;
  $("segVista").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
});

/* ============ FILTRO EN LA URL DE POWER BI ============ */
const texto = v => `'${String(v).replace(/'/g, "''")}'`;
function construirFiltro(){
  const t = POWERBI.tabla, [kpi] = KPIS[+$("selKpi").value];
  return [
    `${t}/kpi eq ${texto(kpi)}`,
    `${t}/equipo eq ${texto($("selEquipo").value)}`,
    `${t}/tipo_periodo eq ${texto(vista)}`,
    `${t}/anio ge ${+$("selDesde").value}`,
    `${t}/anio le ${+$("selHasta").value}`
  ].join(" and ");
}
function urlFiltrada(filtro){
  const base = new URLSearchParams({ reportId: POWERBI.reportId, autoAuth: "true", ctid: POWERBI.tenantId,
    filterPaneEnabled: "false", navContentPaneEnabled: "false" }).toString();
  // $filter al final; "/" y espacios sin codificar. No filtrar por unidad: el símbolo % rompe el filtro.
  const f = encodeURIComponent(filtro).replace(/%2F/g, "/").replace(/%20/g, " ");
  return "https://app.powerbi.com/reportEmbed?" + base + "&$filter=" + f;
}
function aplicar(){
  const url = urlFiltrada(construirFiltro());
  $("informe").src = url;
  $("lnkPestana").href = url;
  $("cargando").textContent = "Cargando el informe con los filtros elegidos...";
}
$("informe").addEventListener("load", () => { $("cargando").textContent = ""; });
if (window.self !== window.top) $("lnkVolver").hidden = true;
$("btnAplicar").addEventListener("click", aplicar);

llenarEquipos();
$("selEquipo").value = "Pala 201";
aplicar();
</script>
</body>
</html>
