<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aprobaciones · Modelo de Excelencia Operacional</title>
<style>
  :root{
    --oems-teal:#009899; --oems-teal-dark:#046566; --oems-terra-dark:#7A310D;
    --gray-900:#2C2C2A; --gray-700:#444441;
    --warm-gray-500:#5F5E5A; --warm-gray-300:#B4B2A9; --warm-gray-100:#D3D1C7; --warm-gray-50:#F1EFE8;
    --white:#FFFFFF;
    --font-display:"Archivo","Helvetica Neue",Arial,sans-serif;
    --font-body:"Inter","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--font-body); background:linear-gradient(180deg, #FFFFFF 0%, #E1F5EE 100%); color:var(--gray-900); line-height:1.5;}

  main{max-width:680px; margin:0 auto; padding:100px 32px 120px; text-align:center;}
  .icon-wrap{
    width:64px; height:64px; border-radius:16px; background:var(--warm-gray-100);
    display:flex; align-items:center; justify-content:center; margin:0 auto 22px; color:var(--warm-gray-500);
  }
  .icon-wrap svg{width:30px; height:30px;}
  h1{font-family:var(--font-display); font-size:20px; font-weight:700; margin-bottom:10px;}
  p{font-size:13.5px; color:var(--warm-gray-500); max-width:420px; margin:0 auto;}

  .digital-transition{
    position:fixed; inset:0; z-index:200; overflow:hidden;
    background:linear-gradient(135deg, #854F0B, #BA7517);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    opacity:1; transition:opacity .4s ease;
  }
  .digital-transition.fade-out{opacity:0; pointer-events:none;}
  .dt-scanlines{
    position:absolute; inset:0;
    background:repeating-linear-gradient(0deg, rgba(255,255,255,0.06) 0px, rgba(255,255,255,0.06) 1px, transparent 1px, transparent 4px);
    animation:dtScan 1.1s linear infinite;
  }
  @keyframes dtScan{ from{ background-position-y:0; } to{ background-position-y:40px; } }
  .dt-icon{
    width:74px; height:74px; border-radius:18px; background:rgba(255,255,255,0.16);
    display:flex; align-items:center; justify-content:center; color:#fff;
    animation:dtPulse 1s ease-in-out infinite;
  }
  .dt-icon svg{width:34px; height:34px;}
  @keyframes dtPulse{ 0%,100%{ transform:scale(1); opacity:0.9; } 50%{ transform:scale(1.08); opacity:1; } }
  .dt-label{color:#fff; font-family:var(--font-display); font-weight:700; font-size:13.5px; letter-spacing:0.02em; opacity:0.9;}

  
  .topbanner{background:#fff; border-bottom:1px solid var(--warm-gray-100); padding:12px clamp(16px,3vw,32px); position:sticky; top:0; z-index:40;}
  .topbanner-inner{max-width:min(1300px,92vw); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .topbanner-inner img.banner-logo-side{height:36px; width:auto; max-width:130px; object-fit:contain; display:block; flex-shrink:0;}
  .banner-center{display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:center; flex:1;}
  .banner-logo-div{width:1px; height:20px; background:var(--warm-gray-100);}
  .banner-crumbs{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .crumb-chip{font-size:11.5px; font-weight:600; color:var(--gray-700); background:var(--warm-gray-50); padding:5px 12px; border-radius:100px; text-decoration:none;}
  .crumb-chip:hover{background:var(--warm-gray-100);}
  .crumb-chip.current{background:#E1F5EE; color:var(--oems-teal-dark); font-weight:700;}
  .crumb-arrow{color:var(--warm-gray-300); font-size:11px;}
  .banner-approvals{font-size:11.5px; font-weight:700; color:var(--oems-teal-dark); background:var(--warm-gray-50); padding:6px 14px; border-radius:100px; text-decoration:none; white-space:nowrap;}
  .banner-approvals:hover{background:var(--warm-gray-100);}
  .fab-home{
    position:fixed; bottom:22px; right:22px; width:52px; height:52px; border-radius:100px;
    background:var(--oems-teal); display:flex; align-items:center; justify-content:center; color:#fff;
    box-shadow:0 6px 16px rgba(4,52,44,0.28); z-index:80; text-decoration:none; transition:background .15s ease;
  }
  .fab-home:hover{background:var(--oems-teal-dark);}
  .fab-home svg{width:22px; height:22px;}
  @media (max-width:480px){ .fab-home{width:46px; height:46px; bottom:16px; right:16px;} }

</style>
</head>
